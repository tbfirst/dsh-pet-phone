name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      with_assets:
        description: "构建时从上游拉取并转码动画素材（体积大，约 100MB+）"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug / assembleRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 注意：不要用 android-actions/setup-android@v3。
      # 它内部会执行 `sdkmanager tools`，而老版 SDK Tools 包已从 Google 仓库下架，
      # 直接报 "Warning: Failed to find package 'tools'" 并以 exit code 1 失败。
      # 这里改为：复用 runner 预装的 SDK，只补装本项目真正需要的组件。
      - name: 配置 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

          # cmdline-tools 的目录名带版本号（例如 cmdline-tools/16.0），不能写死；
          # 用 for + if 而不是 `ls | head`，避免 Actions 默认的 `-eo pipefail` 把空结果当失败
          SDKMGR=""
          for p in "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$p" ]; then SDKMGR="$p"; break; fi
          done
          if [ -z "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager || true)"; fi
          echo "sdkmanager => ${SDKMGR:-<not found>}"

          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            # 已装过就会秒退；装不上时 AGP 也会自行下载（runner 上许可已接受）
            "$SDKMGR" --sdk_root="$SDK" --install \
              "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi

          echo "--- 已安装的平台 ---"
          ls "$SDK/platforms" 2>/dev/null || true
          echo "--- 已安装的 build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || true

      # 仓库已入库 gradle-wrapper.jar，CI 与本地用同一套 Gradle 8.7
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 单元测试（物理层）
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 转码动画素材
        # 素材「允许开源使用、禁止商用」，所以不入库，构建时现取；失败则回落内置占位宠物
        if: github.event.inputs.with_assets != 'false'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          node tools/fetch-and-transcode.mjs || echo "::warning::素材获取失败，本次构建使用内置占位宠物"
          node tools/verify-assets.mjs || true

      - name: 构建 Debug APK（可直接安装）
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 构建 Release APK（无 keystore 时未签名）
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 列出产物
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-phone-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布到 Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-pet-phone-apk
          path: apk

      - name: 重命名并发布
        run: |
          mkdir -p out
          cp apk/debug/*.apk "out/dsh-pet-phone-${GITHUB_REF_NAME}-debug.apk" || true
          cp apk/release/*.apk "out/dsh-pet-phone-${GITHUB_REF_NAME}-release-unsigned.apk" || true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            自动构建产物。Debug 版可直接安装；Release 版未签名，需要自行签名后再分发。
            动画素材版权归 PC2005-cloud/dsh-pet，禁止商用。
